<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Birthday Wish</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: rgba(15, 15, 20, 0.4); /* Translucent background */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .glass-card {
      position: relative;
      width: 100%;
      max-width: 380px;
      padding: 35px 25px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
      color: #fff;
    }
    .balloons { font-size: 40px; margin-bottom: 5px; }
    h1 {
      font-family: 'Brush Script MT', 'cursive', sans-serif;
      font-size: 42px;
      line-height: 1.1;
      color: #fff9e6;
      text-shadow: 0 2px 8px rgba(212, 175, 55, 0.8), 0 0 15px rgba(255, 215, 0, 0.6);
      margin-bottom: 10px;
    }
    .user-info {
      margin-top: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.5px;
    }
    .close-btn {
      margin-top: 25px;
      padding: 10px 24px;
      border: none;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="balloons">🎈 ✨ 🎈</div>
    <h1>Happy Birthday<br>Saran</h1>
    <div class="user-info">
      <div>@|_VIP_JAAT_KING_|</div>

    </div>
    <button class="close-btn" onclick="Telegram.WebApp.close()">Close</button>
  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    // Fire festive confetti immediately on open
    confetti({
      particleCount: 120,
      spread: 70,
      origin: { y: 0.6 }
    });
  </script>
</body>
</html>
